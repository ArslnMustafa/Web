# Contabo VPS için Nginx reverse proxy yapılandırması.
# Kurulum:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/web
#   sudo ln -s /etc/nginx/sites-available/web /etc/nginx/sites-enabled/web
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS için (alan adınız DNS'te VPS IP'sine yönlendikten sonra):
#   sudo certbot --nginx -d example.com -d www.example.com

server {
    listen 80;
    listen [::]:80;

    # Kendi alan adınızla veya VPS IP'nizle değiştirin.
    server_name example.com www.example.com;

    # Next.js uygulaması PM2 ile 3000 portunda çalışır.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js statik dosyaları için önbellek.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
